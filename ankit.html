<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web Page Using CSS</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Playfair+Display&family=Pacifico&display=swap" rel="stylesheet">

    <style>
        /* Page background */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background-image: url("https://images.unsplash.com/photo-1503264116251-35a269479413");
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        h1 {
            text-align: center;
            font-family: 'Playfair Display', serif;
            background-color: rgba(255,255,255,0.9);
            padding: 10px;
        }

        /* Banner with background image */
        .banner {
            margin: 20px auto;
            width: 80%;
            padding: 15px;
            color: yellow;
            font-family: 'Pacifico', cursive;
            background-image: url("https://images.unsplash.com/photo-1492724441997-5dc865305da7");
            background-repeat: repeat-x;
            background-size: contain;
            text-align: center;
        }

        /* Link styling */
        a:link {
            color: blue;
            text-decoration: none;
            cursor: pointer;
        }

        a:hover {
            color: red;
            text-decoration: underline;
            cursor: url("https://cur.cursors-4u.net/mechanics/mec-1/mec48.cur"), auto;
        }

        a:active {
            color: green;
        }

        a:visited {
            color: purple;
        }

        .register {
            text-align: center;
            margin: 20px;
            font-size: 18px;
        }

        /* Image section */
        .img-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-top: 30px;
        }

        .img-container img {
            width: 250px;
            height: auto;
            border-radius: 10px;
        }

        /* Layers */
        .layer-container {
            margin-top: 50px;
            text-align: center;
            position: relative;
            height: 150px;
        }

        .layer1 {
            font-size: 48px;
            color: blue;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
        }

        .layer2 {
            font-size: 52px;
            color: red;
            position: absolute;
            left: 52%;
            top: 20px;
            transform: translateX(-50%);
            z-index: 2;
        }
    </style>
</head>

<body>

    <h1>Web Page using CSS</h1>

    <div class="banner">
        Welcome to Web page using CSS where CSS means Cascading Style Sheets.
        Using CSS we can apply common styles to different tags.
    </div>

    <div class="register">
        <a href="#">Register</a>
    </div>

    <div class="img-container">
        <img src="https://images.unsplash.com/photo-1584697964403-df6c42f9c62b" alt="Audience">
        <img src="https://images.unsplash.com/photo-1581091870627-3b6b3a05a42b" alt="Presentation">
    </div>

    <div class="layer-container">
        <div class="layer1">LAYER 1</div>
        <div class="layer2">LAYER 2</div>
    </div>

</body>
</html>
